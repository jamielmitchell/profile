# Builds and publishes the site. Runs:
#   - whenever you push changes to main
#   - every Monday morning, to pick up new publications/reviews from ORCID
#   - on demand: GitHub > Actions > "Update from ORCID and deploy" > Run workflow
name: Update from ORCID and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC (8am Pacific)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If ORCID or Crossref is down, keep going with the last saved list
      - name: Fetch latest publications and reviews from ORCID
        continue-on-error: true
        run: |
          pip install pyyaml
          python scripts/update_from_orcid.py

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
