<aside class="sidebar">
  <img class="sidebar__photo" src="{{ site.author.photo | relative_url }}" alt="Photo of {{ site.author.name }}">
  <div class="sidebar__text">
    <h2 class="sidebar__name">{{ site.author.name }}</h2>
    <p class="sidebar__bio">{{ site.author.bio }}</p>
    <ul class="sidebar__links">
      {% if site.author.location %}<li><i class="fa-solid fa-location-dot fa-fw" aria-hidden="true"></i>{{ site.author.location }}</li>{% endif %}
      {% if site.author.employer %}<li><i class="fa-solid fa-building-columns fa-fw" aria-hidden="true"></i>{{ site.author.employer }}</li>{% endif %}
      {% for link in site.links %}
        <li><a href="{{ link.url }}"><i class="{{ link.icon }} fa-fw" aria-hidden="true"></i>{{ link.label }}</a></li>
      {% endfor %}
    </ul>
  </div>
</aside>
